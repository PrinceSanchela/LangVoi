[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langvoi"
version = "2.2.0"
description = "Universal Native Audio Engineering Workstation, Laboratory Acoustic Biometrics & Neural Whisper Language Identification"
readme = "README.md"
authors = [
    { name = "Prince Sanchela" }
]
license = { text = "Custom License Agreement" }
requires-python = ">=3.10"
keywords = [
    "audio-workstation",
    "speech-recognition",
    "language-identification",
    "whisper",
    "acoustic-biometrics",
    "pitch-tracking",
    "daw",
    "dsp",
    "audio-analysis"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "SpeechRecognition>=3.10.0",
    "soundfile>=0.12.0",
    "av>=11.0.0",
    "miniaudio>=1.50.0",
    "httpx>=0.25.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/PrinceSanchela/LangVoi"
Repository = "https://github.com/PrinceSanchela/LangVoi.git"
Documentation = "https://github.com/PrinceSanchela/LangVoi#readme"
"Bug Tracker" = "https://github.com/PrinceSanchela/LangVoi/issues"

[project.scripts]
langvoi = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*"]
