name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python -m unittest discover -s tests

      - name: Compile Native C# Binaries
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /target:winexe /win32icon:assets\app_icon.ico /out:LangVoi_Studio.exe launcher.cs
          & $csc /target:winexe /win32icon:assets\app_icon.ico /out:LangVoi_Setup.exe installer.cs

      - name: Create Release Zip Package
        run: |
          Compress-Archive -Path LangVoi_Studio.exe, LangVoi_Setup.exe, LangVoi_Studio.bat, Install_LangVoi.bat, install.ps1, run.py, main.py, requirements.txt, README.md, LICENSE.txt, app, core, assets, samples -DestinationPath LangVoi_Studio_Windows_x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LangVoi_Studio_Windows_x64.zip
            LangVoi_Studio.exe
            LangVoi_Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
